{% extends "layouts/base.html" %}

{% block title %}Kirish - Admin Panel{% endblock %}

{% block login_content %}
<div class="w-full max-w-md">
    <div class="bg-white dark:bg-[#0f111a] p-10 rounded-[3rem] shadow-[0_20px_50px_rgba(0,0,0,0.05)] dark:shadow-[0_20px_50px_rgba(0,0,0,0.3)] border border-slate-100 dark:border-white/5 transition-all duration-500">
        <div class="flex flex-col items-center mb-10">
            <div class="w-20 h-20 bg-primary/10 dark:bg-primary/20 rounded-[2rem] flex items-center justify-center text-primary mb-6 animate-bounce-slow shadow-inner">
                <i class="bi bi-person-lock fs-1"></i>
            </div>
            <h1 class="text-3xl font-black text-slate-800 dark:text-white tracking-tight mb-2">Tizimga kirish</h1>
            <p class="text-slate-400 dark:text-dark-muted font-bold text-sm tracking-tight text-center">Davom etish uchun ma'lumotlarni kiriting</p>
        </div>

        {% if error %}
        <div class="mb-8 p-4 bg-rose-500/5 dark:bg-rose-500/10 border border-rose-500/20 rounded-2xl flex items-center gap-3 text-rose-500 dark:text-rose-400 text-xs">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span class="font-black uppercase tracking-wider">{{ error }}</span>
        </div>
        {% endif %}

        <form method="post" action="/login" class="space-y-6">
            <div>
                <label class="block text-xs font-black text-slate-400 dark:text-dark-muted uppercase tracking-[2px] mb-3 ml-1">Login</label>
                <div class="relative group">
                    <span class="absolute inset-y-0 left-0 pl-5 flex items-center text-slate-300 dark:text-slate-700 group-focus-within:text-primary transition-colors">
                        <i class="bi bi-envelope-at-fill text-lg"></i>
                    </span>
                    <input type="text" name="username" required 
                        class="block w-full pl-14 pr-5 py-4.5 bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/5 rounded-[1.5rem] focus:ring-4 focus:ring-primary/10 dark:focus:ring-primary/5 focus:border-primary outline-none text-slate-700 dark:text-white font-bold placeholder-slate-300 dark:placeholder-slate-700 transition-all"
                        placeholder="Admin loginini kiriting">
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-3 ml-1">
                    <label class="block text-xs font-black text-slate-400 dark:text-dark-muted uppercase tracking-[2px]">Parol</label>
                    <a href="#" class="text-[10px] font-black text-primary uppercase tracking-widest hover:underline">Unutdingizmi?</a>
                </div>
                <div class="relative group">
                    <span class="absolute inset-y-0 left-0 pl-5 flex items-center text-slate-300 dark:text-slate-700 group-focus-within:text-primary transition-colors">
                        <i class="bi bi-shield-lock-fill text-lg"></i>
                    </span>
                    <input type="password" name="password" required 
                        class="block w-full pl-14 pr-5 py-4.5 bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/5 rounded-[1.5rem] focus:ring-4 focus:ring-primary/10 dark:focus:ring-primary/5 focus:border-primary outline-none text-slate-700 dark:text-white font-bold placeholder-slate-300 dark:placeholder-slate-700 transition-all"
                        placeholder="••••••••">
                </div>
            </div>

            <button type="submit" 
                class="w-full py-5 btn-primary-gradient text-white rounded-[1.5rem] font-black text-sm uppercase tracking-[3px] shadow-2xl shadow-primary/30 hover:scale-[1.03] active:scale-[0.97] transition-all">
                Kirish
            </button>
        </form>

        <div class="mt-12 text-center">
            <p class="text-slate-300 dark:text-slate-800 text-[10px] font-black uppercase tracking-[4px]">Konkurs Bot Platformasi</p>
        </div>
    </div>
</div>
{% endblock %}

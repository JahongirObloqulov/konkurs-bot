{% extends "layouts/base.html" %}

{% block title %}Kirish - Admin Panel{% endblock %}

{% block login_content %}
<div class="w-full max-w-md">
    <div class="glass-card p-10 rounded-3xl shadow-2xl border border-white/20">
        <div class="flex flex-col items-center mb-8">
            <div class="w-16 h-16 bg-primary rounded-2xl shadow-xl flex items-center justify-center text-white mb-4">
                <i class="bi bi-shield-lock fs-1"></i>
            </div>
            <h1 class="text-3xl font-black text-indigo-950 tracking-tight">Xush kelibsiz</h1>
            <p class="text-indigo-800/80 text-sm font-medium mt-1">Admin panelga kirish uchun login va parolni kiriting</p>
        </div>

        {% if error %}
        <div class="mb-6 p-4 bg-rose-500/10 border border-rose-500/20 rounded-2xl flex items-center gap-3 text-rose-700 text-sm">
            <i class="bi bi-exclamation-circle fs-5"></i>
            <span class="font-semibold">{{ error }}</span>
        </div>
        {% endif %}

        <form method="post" action="/login" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-indigo-900 uppercase tracking-wider mb-2 ml-1">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-indigo-400">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text" name="username" required 
                        class="block w-full pl-11 pr-4 py-3.5 bg-indigo-50/50 border border-indigo-100 rounded-2xl focus:ring-4 focus:ring-primary/20 focus:border-primary outline-none text-indigo-950 placeholder-indigo-300 transition-all"
                        placeholder="Admin loginini kiriting">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-indigo-900 uppercase tracking-wider mb-2 ml-1">Parol</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-indigo-400">
                        <i class="bi bi-key"></i>
                    </span>
                    <input type="password" name="password" required 
                        class="block w-full pl-11 pr-4 py-3.5 bg-indigo-50/50 border border-indigo-100 rounded-2xl focus:ring-4 focus:ring-primary/20 focus:border-primary outline-none text-indigo-950 placeholder-indigo-300 transition-all"
                        placeholder="••••••••">
                </div>
            </div>

            <button type="submit" 
                class="w-full py-4 bg-primary text-white rounded-2xl font-black text-sm uppercase tracking-widest shadow-xl shadow-primary/30 hover:bg-secondary hover:scale-[1.02] active:scale-[0.98] transition-all">
                Tizimga Kirish
            </button>
        </form>

        <div class="mt-8 text-center">
            <p class="text-indigo-400 text-xs font-medium uppercase tracking-[2px]">Konkurs Bot v1.0.0</p>
        </div>
    </div>
</div>
{% endblock %}

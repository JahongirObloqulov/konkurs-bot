services:
  # Web admin panel + Telegram bot (birgalikda)
  - type: web
    name: konkurs-bot
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CARGO_HOME
        value: /opt/render/project/src/.cargo
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DB_URL
        value: sqlite+aiosqlite:///data/konkurs.db
      - key: WEB_SECRET_KEY
        sync: false
      - key: WEB_ADMIN_USERNAME
        sync: false
      - key: WEB_ADMIN_PASSWORD
        sync: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 1